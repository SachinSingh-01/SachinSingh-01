<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">Sachin's coding arcade</title>
<desc id="desc">A retro pixel-art developer, terminal, and path through Python, data, machine learning, and AI. Decorative animation only; no activity statistics are shown.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a2e"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#203047" stroke-width="1" opacity=".55"/></pattern>
</defs>
<rect width="900" height="260" rx="18" fill="url(#bg)"/><rect width="900" height="260" rx="18" fill="url(#grid)"/>
<text x="34" y="37" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="22" font-weight="700">▣ CODING ARCADE</text>
<text x="35" y="58" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">BUILD • DEBUG • REPEAT</text>
<rect x="300" y="20" width="565" height="138" rx="9" fill="#080d15" stroke="#334155" stroke-width="2"/><path d="M300 47H865" stroke="#334155" stroke-width="2"/>
<circle cx="318" cy="34" r="4" fill="#ff6b6b"/><circle cx="332" cy="34" r="4" fill="#f7c65f"/><circle cx="346" cy="34" r="4" fill="#45d483"/>
<text x="365" y="38" fill="#8b949e" font-family="monospace" font-size="11">sachin@dev: ~/learning</text>
<g font-family="monospace" font-size="13"><text x="320" y="69" fill="#7ee787">$ python build_future.py</text><text x="320" y="91" fill="#79c0ff">import</text><text x="371" y="91" fill="#f0f6fc"> pandas </text><text x="438" y="91" fill="#d2a8ff">as</text><text x="458" y="91" fill="#f0f6fc"> pd</text><text x="320" y="113" fill="#79c0ff">print</text><text x="360" y="113" fill="#f0f6fc">(</text><text x="367" y="113" fill="#a5d6ff">"keep learning"</text><text x="475" y="113" fill="#f0f6fc">)</text><rect x="320" y="127" width="8" height="13" fill="#39d353"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect><text x="339" y="138" fill="#7ee787" font-size="11">process running...</text></g>
<g transform="translate(55 100)" shape-rendering="crispEdges"><rect x="24" y="0" width="24" height="8" fill="#79c0ff"/><rect x="16" y="8" width="40" height="8" fill="#79c0ff"/><rect x="8" y="16" width="56" height="24" fill="#79c0ff"/><rect x="16" y="20" width="8" height="8" fill="#0d1117"/><rect x="48" y="20" width="8" height="8" fill="#0d1117"/><rect x="24" y="32" width="24" height="8" fill="#0d1117"/><rect x="0" y="40" width="72" height="24" fill="#58a6ff"/><rect x="8" y="64" width="16" height="16" fill="#d2a8ff"/><rect x="48" y="64" width="16" height="16" fill="#d2a8ff"/><rect x="0" y="44" width="8" height="16" fill="#f0f6fc"/><rect x="64" y="44" width="8" height="16" fill="#f0f6fc"/><animateTransform attributeName="transform" type="translate" values="55 100;55 96;55 100" dur="1.4s" repeatCount="indefinite"/></g>
<path d="M36 190H864" stroke="#334155" stroke-width="3" stroke-dasharray="5 7"/>
<g shape-rendering="crispEdges"><rect x="42" y="178" width="48" height="12" fill="#1f6feb"/><rect x="54" y="166" width="24" height="12" fill="#58a6ff"/><rect x="120" y="178" width="48" height="12" fill="#238636"/><rect x="132" y="166" width="24" height="12" fill="#39d353"/><rect x="198" y="178" width="48" height="12" fill="#8957e5"/><rect x="210" y="166" width="24" height="12" fill="#d2a8ff"/></g>
<g font-family="monospace" font-size="12" font-weight="700"><rect x="285" y="176" width="112" height="34" rx="5" fill="#122b22" stroke="#238636"/><text x="341" y="197" text-anchor="middle" fill="#7ee787">PYTHON</text><rect x="414" y="176" width="112" height="34" rx="5" fill="#10253a" stroke="#1f6feb"/><text x="470" y="197" text-anchor="middle" fill="#79c0ff">DATA</text><rect x="543" y="176" width="148" height="34" rx="5" fill="#211a35" stroke="#8957e5"/><text x="617" y="197" text-anchor="middle" fill="#d2a8ff">MACHINE LEARNING</text><rect x="708" y="176" width="112" height="34" rx="5" fill="#122b22" stroke="#238636"/><text x="764" y="197" text-anchor="middle" fill="#7ee787">AI</text></g>
<g fill="#39d353"><rect x="400" y="188" width="5" height="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></rect><rect x="529" y="188" width="5" height="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" begin=".3s" repeatCount="indefinite"/></rect><rect x="696" y="188" width="5" height="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" begin=".6s" repeatCount="indefinite"/></rect></g>
<text x="450" y="238" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">One line at a time. One project at a time.</text>
</svg>